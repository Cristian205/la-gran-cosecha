  <head>
    <meta charset="UTF-8" />

    <title>La Gran Cosecha — Panel Administrativo</title>

    <!-- El icono es de CryneX y no del negocio: el panel es el producto, y lo
         usan todos los clientes. Quien tiene abiertas dos pestañas del mismo
         panel para dos empresas distintas las distingue por el título, que sí
         es del negocio. El monograma va sobre baldosa blanca porque el azul
         marino se pierde en una barra de pestañas oscura. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter es la fuente propia del panel; las demás solo se cargan para
         previsualizar con precisión el selector de fuente de la tienda
         pública en Contenido → Apariencia. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
