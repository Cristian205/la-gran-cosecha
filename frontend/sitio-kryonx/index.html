    <!-- Manrope para titulares y contenido; Inter para interfaces. Fraunces,
         Space Grotesk, DM Serif Display e Instrument Serif solo las usan las
         tiendas de ejemplo: cada una tiene que parecer de un negocio distinto,
         y la tipografía es la mitad de eso.
         La hoja NO bloquea el primer pintado: se pide como `preload` y se
         activa al llegar. Con `display=swap` el texto sale primero con la
         fuente de respaldo. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@500;700&family=DM+Serif+Display&family=Instrument+Serif:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
