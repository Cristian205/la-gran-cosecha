[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = tests
addopts = --strict-markers -q

markers =
    tenancy: pruebas de aislamiento multi-tenant. FALLAN a proposito hasta la fase 3.
    postgres: requiere PostgreSQL real (TEST_DATABASE_URL); se salta en SQLite.

# La suite verde del dia a dia es:   pytest -m "not tenancy"
# El aislamiento entre negocios es:  pytest -m tenancy   (en verde desde la fase 3)
