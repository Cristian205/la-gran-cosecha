services:
  - type: web
    # Conserva el nombre de antes de Kryon X a propósito: un Blueprint de Render
    # identifica el servicio por este nombre, y cambiarlo crearía uno nuevo con
    # otra URL en vez de renombrar el existente.
    name: crynex-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /healthz

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: MEDIA_ROOT
        value: /app/media

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Sin esta clave el correo NO sale: Render bloquea los puertos SMTP
      # salientes en las instancias free.
      - key: BREVO_API_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: "1"

      # --- Cloudflare R2: almacenamiento de los archivos subidos ---
      # Con estas cuatro puestas, media deja de depender del disco del
      # contenedor (que en el plan free es efimero y se borra en cada deploy).
      # Si falta alguna, Django vuelve a guardar en disco local.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Subdominio r2.dev del bucket, o dominio propio conectado a el.
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_LOCATION
        value: media

      # --- WhatsApp (apps.mensajeria): Meta Cloud API + Twilio de respaldo ---
      # Sin ellas el sistema funciona igual y no envía nada (o usa el modo
      # SIMULADO si el negocio lo elige). Guía: backend/WHATSAPP.md
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: TWILIO_WEBHOOK_BASE_URL
        sync: false
