# Ping periódico al backend en Railway (antes estaba en Render, ya suspendido).
# Sirve como monitor: si /healthz deja de responder, el run falla y GitHub
# avisa por correo. Si el servicio tiene activado «App Sleeping» en Railway,
# además lo mantiene despierto.
name: Mantener el backend despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping a /healthz
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://api.crafteech.com/healthz
