# La red de seguridad, ejecutandose sola.
#
# Hasta ahora los seis guardias del proyecto solo corrian si alguien se acordaba
# de lanzar `pytest` antes de subir. Todos protegen fallos que NO dan error
# —una seccion que no se pinta, un modulo contratado y apagado a la vez, una
# tabla fuera de la RLS— y por eso hace falta que corran solos: son justo los
# que nadie va a echar de menos hasta la auditoria.
#
# Dos trabajos, y el segundo es el que importa de verdad.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Un push encima de otro cancela el anterior: nadie mira el resultado de un
  # commit que ya no es la cabeza de la rama.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. El backend, con PostgreSQL de verdad
  # ==========================================================================
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crynex_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      # La RLS NO se aplica a roles con SUPERUSER ni BYPASSRLS, y el `postgres`
      # de la imagen tiene los dos. Con ese rol las politicas existen y no hacen
      # nada: la suite pasaria en verde sin haber comprobado la tercera capa.
      # Es la misma trampa que documenta `tenancy/0003` sobre Supabase.
      - name: Crear el rol de la aplicacion, sin privilegios
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d crynex_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_crynex LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS CREATEDB;
          GRANT ALL ON SCHEMA public TO app_crynex;
          SQL

      - name: Migraciones al dia
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      # Con `TEST_DATABASE_URL` se activan los dos tests de RLS y el de
      # concurrencia del POS —dos cajeros vendiendo la ultima unidad—, que en
      # SQLite se saltan solos porque `select_for_update` no bloquea nada.
      - name: Suite completa
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://app_crynex:app@localhost:5432/crynex_ci
        run: pytest -q

  # ==========================================================================
  # 2. Los frontends
  # ==========================================================================
  frontend:
    runs-on: ubuntu-latest
    strategy:
      # Sin `fail-fast`: si la tienda falla, sigue interesando saber si el panel
      # tambien. Enterarse de los dos fallos de una vez ahorra un ciclo entero.
      fail-fast: false
      matrix:
        app: [tienda, admin-panel, panel-crynex]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Comprobar tipos
        working-directory: frontend/${{ matrix.app }}
        run: npx tsc --noEmit

      # Compilar y no solo comprobar tipos: varios fallos de este proyecto
      # —una importacion circular, una variable de entorno que falta— solo
      # aparecen al construir.
      - name: Compilar
        working-directory: frontend/${{ matrix.app }}
        run: npm run build
